
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Wins | Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <h1>🌱 Little Wins</h1>
    <p class="subtitle">Small steps, big changes.</p>

    <section class="progress-card">
      <h2>Today's Progress</h2>
      <p><span id="completed">0</span> of 10 habits completed</p>

      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </section>

    <h2>My Daily Habits</h2>

    <label class="habit">
      <input type="checkbox">
      No phone 90 min after waking up
    </label>

    <label class="habit">
      <input type="checkbox">
      Sun on face and shower
    </label>

    <label class="habit">
      <input type="checkbox">
      Read for 20 minutes
    </label>

    <label class="habit">
      <input type="checkbox">
      Drink water
    </label>

    <label class="habit">
      <input type="checkbox">
      Meditate and breath work
    </label>

    <label class="habit">
      <input type="checkbox">
      Create: Content or write or edit or sketch
    </label>

    <label class="habit">
      <input type="checkbox">
      Exercise
    </label>

    <label class="habit">
      <input type="checkbox">
      Oral care x 2
    </label>

    <label class="habit">
      <input type="checkbox">
      Language practice
    </label>

    <label class="habit">
      <input type="checkbox">
      Practise coding
    </label>

    <footer>Every little win counts! 🌱</footer>
  </main>
</body>
</html>
